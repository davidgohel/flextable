# From https://github.com/dessant/lock-threads
name: 'Lock threads'

on:
  # chaque semaine le jeudi a 5 AM
  schedule:
    - cron: '0 5 * * 4'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  discussions: write

concurrency:
  group: lock-threads

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v6
        with:
          issue-inactive-days: '180'
          issue-comment: >
            This old thread has been automatically locked. If you think you have
            found something related to this, please open a new issue and link to this
            old issue if necessary.
          issue-lock-reason: 'resolved'
          pr-inactive-days: '180'
          pr-lock-reason: 'resolved'
          discussion-inactive-days: '180'
